[project]
name = "customer-churn-prediction"
version = "0.1.0"
description = ""

readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "xgboost (>=3.1.1,<4.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "scikit-optimize (>=0.10.2,<0.11.0)",
    "mlflow (>=3.5.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.split]
valid_size = 40
test_size = 10
# train_size = 100 - (test_size + valid_size)

[tool.xgb_bayes]
n_trials = 20
random_state = 42
early_stopping_rounds = 50
processed_dir = "data/split"
target_name = "churn"
objective_name = "binary:logistic"
num_boost_round = 800

[tool.xgb_bayes.space]
max_depth        = { type = "int",   lower = 3,    upper = 15 }
max_bin          = { type = "int",   lower = 64,   upper = 256 }
eta              = { type = "float", lower = 0.01, upper = 0.5,  log = true }  # learning rate 
subsample        = { type = "float", lower = 0.5,  upper = 1.0 }
colsample_bytree = { type = "float", lower = 0.5,  upper = 1.0 }
min_child_weight = { type = "float", lower = 1.0,  upper = 14.0 }
gamma            = { type = "float", lower = 0.0,  upper = 8.0 }
reg_lambda       = { type = "float", lower = 1e-4, upper = 10.0, log = true }
reg_alpha        = { type = "float", lower = 1e-4, upper = 10.0, log = true }
grow_policy      = { type = "cat",   values = ["depthwise", "lossguide"] }
booster          = { type = "cat",   values = ["gbtree", "dart"] }
sampling_method  = { type = "cat", values = ["uniform"] }